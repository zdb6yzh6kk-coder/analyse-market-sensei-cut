[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse-market-sensei-cut"
version = "0.1.0"
description = "Local Streamlit market analysis dashboard for Sensei Cut"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.54",
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2",
  "duckdb>=1.0",
  "plotly>=5.22",
  "pillow>=12.2",
  "requests>=2.33",
  "urllib3>=2.7",
  "curl-cffi>=0.15",
  "pyarrow>=23.0.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]
